name: Deploy khronos-api

on:
  push:
    branches: [main]
    paths: ['khronos-api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix khronos-api || npm install --prefix khronos-api
      - name: Check for unfilled placeholders in wrangler.jsonc
        id: placeholders
        run: |
          if grep -v '^\s*//' khronos-api/wrangler.jsonc | grep -q '"PASTE_'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::khronos-api/wrangler.jsonc still has PASTE_ placeholders; not deploying (see khronos-api/README.md)"
          fi
      - name: Deploy to Cloudflare
        if: steps.placeholders.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: khronos-api
          command: deploy
